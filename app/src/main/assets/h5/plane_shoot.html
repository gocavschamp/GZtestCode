<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>✈️ 打飞机</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{overflow:hidden;background:#0b1f33;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
  body{touch-action:none;}
  canvas{display:block;}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,25,42,.85);z-index:20;color:#fff;text-align:center;padding:0 24px;}
  .overlay.hide{display:none;}
  .overlay h2{font-size:40px;margin-bottom:12px;}
  .overlay p{font-size:18px;line-height:1.7;margin-bottom:22px;color:#B3E5FC;}
  .overlay .final{font-size:28px;color:#FFD54F;margin-bottom:10px;}
  .btn{border:none;border-radius:28px;padding:14px 44px;font-size:20px;font-weight:bold;color:#fff;background:linear-gradient(135deg,#FFB74D,#F4511E);box-shadow:0 5px 14px rgba(0,0,0,.4);cursor:pointer;}
  .btn:active{transform:scale(.94);}
</style>
</head>
<body>
<div class="overlay" id="overlay">
  <h2>✈️ 打飞机</h2>
  <p>按住拖动飞机，自动开火<br>吃到 ⭐🔥❤️💎 会变厉害！<br>小心别让敌机撞到你！</p>
  <button class="btn" id="startBtn">🚀 开始游戏</button>
</div>
<canvas id="game"></canvas>
<script>
(function(){
  var canvas=document.getElementById('game');
  var ctx=canvas.getContext('2d');
  var overlay=document.getElementById('overlay');
  var W=0,H=0,DPR=1;

  function resize(){
    DPR=window.devicePixelRatio||1;
    W=window.innerWidth;H=window.innerHeight;
    canvas.width=W*DPR;canvas.height=H*DPR;
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize',resize);resize();

  var state='ready';
  var score=0,lives=3,elapsed=0;
  var player={x:0,y:0,w:54,h:54,tx:0};
  var bullets=[],enemies=[],booms=[],stars=[];
  var powerups=[],fireTimer=0,spawnTimer=0;
  var power=0,fastTimer=0,powerSpawnTimer=0;
  var tip='',tipT=0;

  for(var i=0;i<60;i++){
    stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.5});
  }

  function reset(){
    score=0;lives=10;elapsed=0;
    bullets=[];enemies=[];booms=[];powerups=[];
    power=0;fastTimer=0;powerSpawnTimer=2600;
    player.x=W/2;player.tx=W/2;player.y=H-100;
    fireTimer=0;spawnTimer=900;
  }

  function spawnEnemy(){
    // 敌机速度有上限，后期也不会过快；配合曲线机动（类似雷霆战机）
    if(Math.random()<0.72){
      // 普通敌机：小幅曲线摆动
      var px=34+Math.random()*(W-68);
      enemies.push({x:px,bx:px,y:-56,w:46,h:46,
        vy:Math.min(2.0,0.7+Math.random()*0.6+elapsed*0.0005),hp:1,pts:10,emoji:'🛩️',
        phase:Math.random()*6.28,amp:0.8+Math.random()*1.0,freq:0.004+Math.random()*0.004});
    }else{
      // 幽浮：大幅曲线摆动，速度更慢
      var px=34+Math.random()*(W-68);
      enemies.push({x:px,bx:px,y:-56,w:52,h:52,
        vy:Math.min(1.5,0.5+Math.random()*0.4+elapsed*0.0003),hp:2,pts:25,emoji:'🛸',
        phase:Math.random()*6.28,amp:2.0+Math.random()*1.8,freq:0.004+Math.random()*0.004});
    }
  }

  // 彩蛋道具：吃到会变厉害
  function spawnPowerup(){
    var kinds=['⭐','🔥','❤️','💎'];
    var k=kinds[Math.floor(Math.random()*kinds.length)];
    powerups.push({x:34+Math.random()*(W-68),y:-40,r:22,k:k,vy:1.0,phase:Math.random()*6.28});
  }

  function applyPowerup(k){
    if(k==='⭐'){power=Math.min(2,power+1);tip='⭐ 火力升级！';}
    else if(k==='🔥'){fastTimer=8000;tip='🔥 急速射击！';}
    else if(k==='❤️'){lives=Math.min(10,lives+1);tip='❤️ 生命 +1！';}
    else{score+=100;tip='💎 +100 分！';}
    tipT=1000;
  }

  function boom(x,y){booms.push({x:x,y:y,t:0});}

  function damage(){
    lives--;
    // 被撞后强化重置，更平衡
    power=0;fastTimer=0;
    boom(player.x,player.y);
    if(lives<=0){
      state='over';
      overlay.innerHTML=
        '<h2>💥 游戏结束</h2>'+
        '<p class="final">得分：'+score+'</p>'+
        '<button class="btn" id="startBtn">🔁 再来一局</button>';
      overlay.className='overlay';
      document.getElementById('startBtn').onclick=function(){
        reset();state='play';overlay.className='overlay hide';
      };
    }
  }

  function update(dt){
    elapsed+=dt;
    for(var i=0;i<stars.length;i++){
      stars[i].y+=stars[i].s*dt*0.02;
      if(stars[i].y>H){stars[i].y=-5;stars[i].x=Math.random()*W;}
    }
    player.x+=(player.tx-player.x)*Math.min(1,dt*0.02);
    if(player.x<player.w/2)player.x=player.w/2;
    if(player.x>W-player.w/2)player.x=W-player.w/2;

    fireTimer+=dt;
    var interval=fastTimer>0?200:360;
    if(fireTimer>interval){
      fireTimer=0;
      // 火力升级后一次多发子弹
      var n=1+power;
      for(var k=0;k<n;k++){
        bullets.push({x:player.x+(k-(n-1)/2)*16,y:player.y-32,w:6,h:18,vy:15});
      }
    }
    spawnTimer+=dt;
    var interval2=Math.max(420,1050-elapsed*0.02);
    if(spawnTimer>interval2){spawnTimer=0;spawnEnemy();}
    if(fastTimer>0)fastTimer-=dt;
    if(tipT>0)tipT-=dt;

    // 道具生成与移动
    powerSpawnTimer+=dt;
    if(powerSpawnTimer>4800){powerSpawnTimer=0;spawnPowerup();}
    for(var i=powerups.length-1;i>=0;i--){
      var pu=powerups[i];
      pu.y+=pu.vy;
      if(pu.y>H+40){powerups.splice(i,1);continue;}
      if(Math.abs(pu.x-player.x)<(pu.r+player.w/2)&&Math.abs(pu.y-player.y)<(pu.r+player.h/2)){
        powerups.splice(i,1);
        applyPowerup(pu.k);
      }
    }

    for(var i=bullets.length-1;i>=0;i--){
      bullets[i].y-=bullets[i].vy;
      if(bullets[i].y<-20)bullets.splice(i,1);
    }
    for(var i=enemies.length-1;i>=0;i--){
      var e=enemies[i];
      e.y+=e.vy;
      // 曲线机动：沿出生点做正弦摆动，路线多变但速度可控
      e.x=e.bx+e.amp*Math.sin(elapsed*e.freq+e.phase);
      var removed=false;
      for(var j=bullets.length-1;j>=0;j--){
        var b=bullets[j];
        if(Math.abs(b.x-e.x)<(b.w+e.w)/2&&Math.abs(b.y-e.y)<(b.h+e.h)/2){
          bullets.splice(j,1);
          e.hp--;
          if(e.hp<=0){boom(e.x,e.y);score+=e.pts;enemies.splice(i,1);removed=true;}
          break;
        }
      }
      if(removed)continue;
      // 敌机溜走到底部不扣血：只有撞到我方才扣血
      if(e.y-e.h/2>H+20){enemies.splice(i,1);continue;}
      // 碰撞判定：用视觉缩小后的碰撞盒，避免“看着没碰到却扣血”
      var ew=e.w*0.65,eh=e.h*0.65,pw=player.w*0.6,ph=player.h*0.6;
      if(Math.abs(e.x-player.x)<(ew+pw)/2&&Math.abs(e.y-player.y)<(eh+ph)/2){
        enemies.splice(i,1);damage();
      }
    }
    for(var i=booms.length-1;i>=0;i--){
      booms[i].t+=dt;
      if(booms[i].t>350)booms.splice(i,1);
    }
  }

  function draw(){
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0b1f33');g.addColorStop(1,'#123a5c');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';
    for(var i=0;i<stars.length;i++){
      ctx.globalAlpha=0.35+0.55*Math.abs(Math.sin(stars[i].x+stars[i].y));
      ctx.fillRect(stars[i].x,stars[i].y,2,2);
    }
    ctx.globalAlpha=1;
    ctx.fillStyle='#FFEB3B';
    for(var i=0;i<bullets.length;i++)ctx.fillRect(bullets[i].x-3,bullets[i].y-9,6,18);

    ctx.textAlign='center';ctx.textBaseline='middle';
    for(var i=0;i<enemies.length;i++){
      ctx.font='46px sans-serif';
      ctx.fillText(enemies[i].emoji,enemies[i].x,enemies[i].y);
    }
    // 道具：只绘制 emoji，不画半透明白底，避免遮挡敌机使其“变浅色”
    for(var i=0;i<powerups.length;i++){
      var pu=powerups[i];
      ctx.globalAlpha=0.8+0.2*Math.sin(elapsed*0.008+pu.phase);
      ctx.font='36px sans-serif';
      ctx.fillText(pu.k,pu.x,pu.y);
    }
    ctx.globalAlpha=1;
    ctx.font='54px sans-serif';
    ctx.fillText('✈️',player.x,player.y);
    for(var i=0;i<booms.length;i++){
      ctx.globalAlpha=Math.max(0,1-booms[i].t/350);
      ctx.font='42px sans-serif';
      ctx.fillText('💥',booms[i].x,booms[i].y);
    }
    ctx.globalAlpha=1;

    ctx.textAlign='left';ctx.textBaseline='top';
    ctx.font='bold 20px sans-serif';ctx.fillStyle='#FFD54F';
    ctx.fillText('✈️ '+score,14,14);
    // 强化状态
    var fireStr='';
    for(var i=0;i<1+power;i++)fireStr+='🔫';
    if(fastTimer>0)fireStr+=' 🔥';
    if(fireStr!=='🔫')ctx.fillText(fireStr,14,42);
    ctx.textAlign='right';ctx.font='bold 22px sans-serif';ctx.fillStyle='#FF5252';
    ctx.fillText('❤️ x'+lives,W-14,10);
    // 吃到道具提示
    if(tipT>0){
      ctx.globalAlpha=Math.min(1,tipT/350);
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font='bold 26px sans-serif';ctx.fillStyle='#FFD54F';
      ctx.fillText(tip,W/2,H*0.2);
      ctx.globalAlpha=1;
    }
  }

  var last=0;
  function frame(t){
    var dt=Math.min(50,last?t-last:16);last=t;
    if(state==='play')update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('touchstart',function(e){
    e.preventDefault();
    if(state==='play')player.tx=e.touches[0].clientX;
  },{passive:false});
  canvas.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(state==='play')player.tx=e.touches[0].clientX;
  },{passive:false});
  canvas.addEventListener('mousemove',function(e){
    if(state==='play')player.tx=e.clientX;
  });

  document.getElementById('startBtn').onclick=function(){
    reset();state='play';overlay.className='overlay hide';
  };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
