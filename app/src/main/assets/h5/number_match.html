<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>数字翻牌记忆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #7EC8E3 0%, #A8D8EA 40%, #FFE0B2 100%);
    min-height: 100vh;
    padding: 16px;
    user-select: none;
  }
  .header { text-align: center; margin-bottom: 10px; }
  .header h1 { font-size: 26px; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .bar {
    display: flex; justify-content: center; align-items: center; gap: 14px;
    background: rgba(255,255,255,.65); border-radius: 24px;
    padding: 10px 18px; margin: 10px auto 14px; max-width: 380px;
    font-size: 16px; color: #37474F; font-weight: bold;
  }
  .bar span { color: #FB8C00; }
  .btn {
    border: none; border-radius: 22px; padding: 10px 22px;
    font-size: 16px; font-weight: bold; color: #fff;
    background: linear-gradient(135deg, #FFB74D, #FB8C00);
    box-shadow: 0 4px 10px rgba(251,140,0,.4); cursor: pointer;
  }
  .btn:active { transform: scale(.94); }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    max-width: 380px;
    margin: 0 auto;
  }
  .card {
    aspect-ratio: 1 / 1;
    background: linear-gradient(135deg, #4FC3F7, #0288D1);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; font-weight: bold; color: #fff;
    cursor: pointer;
    transition: transform .25s, background .25s;
    box-shadow: 0 4px 8px rgba(0,0,0,.18);
  }
  .card.back { background: linear-gradient(135deg, #4FC3F7, #0288D1); }
  .card.front {
    background: linear-gradient(135deg, #FFF3E0, #FFE0B2);
    color: #E65100;
  }
  .card.matched {
    background: linear-gradient(135deg, #C8E6C9, #81C784);
    color: #1B5E20;
    transform: scale(.92);
    opacity: .85;
  }
  .card.flipped { transform: rotateY(180deg); }
  .msg {
    text-align: center; margin-top: 14px;
    font-size: 18px; font-weight: bold; color: #37474F;
    min-height: 24px;
  }
  .footer { text-align: center; margin-top: 12px; }
</style>
</head>
<body>
  <div class="header">
    <h1>🃏 数字翻牌</h1>
    <div class="bar">
      <div>⏱ <span id="time">0</span> 秒</div>
      <div>⭐ <span id="score">0</span></div>
      <div>✅ <span id="pairs">0</span> / 6</div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"></div>
  <div class="footer"><button class="btn" id="restart">🔄 重新开始</button></div>

<script>
  var VALUES = [1,2,3,4,5,6];
  var firstCard = null, lock = false, score = 0, pairs = 0;
  var timer = 0, timerId = null;

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function buildBoard() {
    var cards = shuffle(VALUES.concat(VALUES));
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    cards.forEach(function (v) {
      var div = document.createElement('div');
      div.className = 'card back';
      div.dataset.value = v;
      div.innerHTML = '❓';
      div.addEventListener('click', function () { flip(div); });
      grid.appendChild(div);
    });
    firstCard = null; lock = false; score = 0; pairs = 0;
    document.getElementById('score').textContent = 0;
    document.getElementById('pairs').textContent = 0;
    document.getElementById('msg').textContent = '';
  }

  function flip(card) {
    if (lock || card.classList.contains('front') || card.classList.contains('matched')) return;
    card.classList.add('front');
    card.innerHTML = card.dataset.value;
    if (!firstCard) {
      firstCard = card;
      return;
    }
    lock = true;
    if (firstCard.dataset.value === card.dataset.value) {
      score += 10; pairs++;
      document.getElementById('score').textContent = score;
      document.getElementById('pairs').textContent = pairs;
      firstCard.classList.add('matched');
      card.classList.add('matched');
      document.getElementById('msg').textContent = '🎉 配对成功！';
      firstCard = null; lock = false;
      if (pairs === VALUES.length) {
        clearInterval(timerId);
        document.getElementById('msg').textContent = '🏆 太棒了！全部配对成功！用时 ' + timer + ' 秒';
      }
    } else {
      var a = firstCard, b = card;
      document.getElementById('msg').textContent = '😅 不一样，再试试';
      setTimeout(function () {
        a.classList.remove('front'); a.innerHTML = '❓';
        b.classList.remove('front'); b.innerHTML = '❓';
        firstCard = null; lock = false;
      }, 700);
    }
  }

  document.getElementById('restart').addEventListener('click', function () {
    clearInterval(timerId);
    timer = 0;
    document.getElementById('time').textContent = 0;
    buildBoard();
    timerId = setInterval(function () {
      timer++;
      document.getElementById('time').textContent = timer;
    }, 1000);
  });

  // 自动开始
  document.getElementById('restart').click();
</script>
</body>
</html>
